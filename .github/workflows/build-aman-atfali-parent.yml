name: Build Aman Atfali Parent APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'aman-atfali-parent/**'
      - '.github/workflows/build-aman-atfali-parent.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aman-atfali-parent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AmanAtfali-Parent-debug
          path: aman-atfali-parent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
